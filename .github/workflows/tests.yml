name: Test

on:
  push:
  pull_request:

# Il token del workflow può solo leggere il repository
permissions:
  contents: read

# Un nuovo push sullo stesso ramo annulla l'esecuzione precedente ancora in corso
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: gd, exif, fileinfo, mbstring, pdo_sqlite
          coverage: none

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Dipendenze PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      # Le viste usano @vite: senza il build (o il dev server) i test non possono renderizzarle
      - name: Dipendenze e build front-end
        run: |
          npm ci
          npm run build

      - name: Configurazione
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml usa SQLite in memoria e Scout "collection": nessun servizio esterno necessario
      - name: Test
        run: php artisan test

  pint:
    name: Stile del codice (Pint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Dipendenze PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

  larastan:
    name: Analisi statica (Larastan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Dipendenze PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      # Livello e cartelle in phpstan.neon; Larastan legge le migrazioni per conoscere le colonne dei modelli
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  agent:
    name: Agente AI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-agent

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # uv installa da solo il Python indicato in .python-version (3.12)
      - name: uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: ai-agent/uv.lock

      - name: Dipendenze (versioni bloccate da uv.lock)
        run: uv sync --locked

      # I test usano un modello e un Laravel finti: Ollama non serve
      - name: Test
        run: uv run pytest

      - name: Stile (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

  audit:
    name: Vulnerabilità note nelle dipendenze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Composer
        run: composer audit --locked --no-interaction

      - name: npm
        run: npm audit

      - name: uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Python
        working-directory: ai-agent
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit --no-deps --disable-pip -r requirements-audit.txt
